<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbit Sim</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        padding: 0;
        background: #000;
        color: white;
        font-family: Arial, sans-serif;
    }

    body {
        width: 100%;
        overflow-x: hidden;
    }

    .simulation-container {
        width: 100%;
        max-width: 1000px;
        margin: 0 auto;
        padding: 14px;
    }

    .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 10px;
    }

    .title {
        margin: 0;
        font-size: 20px;
        letter-spacing: 2px;
    }

    .status {
        font-size: 13px;
        color: #aaa;
    }

    canvas {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 16 / 9;
        background: #000;
        border: 1px solid #222;
        border-radius: 8px;
        touch-action: none;
    }

    .bottom-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 10px;
    }

    .instructions {
        font-size: 13px;
        color: #999;
    }

    button {
        min-height: 44px;
        padding: 9px 16px;
        background: #181818;
        color: white;
        border: 1px solid #555;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
    }

    button:hover {
        background: #252525;
    }

    @media (max-width: 500px) {
        .simulation-container {
            padding: 8px;
        }

        .title {
            font-size: 17px;
        }

        .instructions {
            font-size: 12px;
        }

        .bottom-bar {
            align-items: stretch;
        }

        button {
            width: 100%;
        }
    }
</style>
</head>

<body>

<div class="simulation-container">

    <div class="top-bar">
        <h1 class="title">ORBIT SIM</h1>
        <div class="status" id="status">ORBITING</div>
    </div>

    <canvas id="simulationCanvas"></canvas>

    <div class="bottom-bar">
        <div class="instructions">
            Drag the spacecraft to launch it
        </div>

        <button id="resetButton">
            Reset Simulation
        </button>
    </div>

</div>

<script>

const canvas = document.getElementById("simulationCanvas");
const ctx = canvas.getContext("2d");

const statusText = document.getElementById("status");
const resetButton = document.getElementById("resetButton");


// --------------------------------------------------
// SIMULATION SETTINGS
// --------------------------------------------------

const TIME_SCALE = 0.25;

const START_X = 640;
const START_Y = 100;

const START_VELOCITY_X = 5.0;
const START_VELOCITY_Y = 0;

const BASE_WIDTH = 1280;
const BASE_HEIGHT = 720;


// --------------------------------------------------
// DISPLAY SETTINGS
// --------------------------------------------------

let displayWidth = 1280;
let displayHeight = 720;
let devicePixelRatioValue = 1;


// --------------------------------------------------
// SPACECRAFT
// --------------------------------------------------

let spacecraftX;
let spacecraftY;

let velocityX;
let velocityY;


// --------------------------------------------------
// SIMULATION STATE
// --------------------------------------------------

let crashed = false;
let escaped = false;
let dragging = false;

let launchStartX = 0;
let launchStartY = 0;


// --------------------------------------------------
// TRAJECTORY
// --------------------------------------------------

let trajectory = [];


// --------------------------------------------------
// TIME
// --------------------------------------------------

let lastTime = performance.now();


// --------------------------------------------------
// RESPONSIVE CANVAS
// --------------------------------------------------

function resizeCanvas() {

    const rect = canvas.getBoundingClientRect();

    displayWidth = Math.max(280, rect.width);
    displayHeight = displayWidth * 9 / 16;

    devicePixelRatioValue =
        Math.min(window.devicePixelRatio || 1, 2);

    canvas.width =
        Math.round(displayWidth * devicePixelRatioValue);

    canvas.height =
        Math.round(displayHeight * devicePixelRatioValue);

    ctx.setTransform(
        devicePixelRatioValue,
        0,
        0,
        devicePixelRatioValue,
        0,
        0
    );
}


// --------------------------------------------------
// DISPLAY SCALING
// --------------------------------------------------

function scaleX(x) {

    return x * (displayWidth / BASE_WIDTH);
}


function scaleY(y) {

    return y * (displayHeight / BASE_HEIGHT);
}


// --------------------------------------------------
// RESET
// --------------------------------------------------

function resetSimulation() {

    resizeCanvas();

    spacecraftX = START_X;
    spacecraftY = START_Y;

    velocityX = START_VELOCITY_X;
    velocityY = START_VELOCITY_Y;

    crashed = false;
    escaped = false;
    dragging = false;

    trajectory = [];

    statusText.textContent = "ORBITING";

    lastTime = performance.now();
}


// --------------------------------------------------
// DRAW
// --------------------------------------------------

function draw() {

    ctx.clearRect(
        0,
        0,
        displayWidth,
        displayHeight
    );


    // Planet

    const planetX = scaleX(640);
    const planetY = scaleY(360);
    const planetRadius = scaleX(100);

    ctx.beginPath();

    ctx.arc(
        planetX,
        planetY,
        planetRadius,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "#1769d1";

    ctx.fill();


    // Trajectory

    if (trajectory.length > 1) {

        ctx.beginPath();

        ctx.moveTo(
            scaleX(trajectory[0][0]),
            scaleY(trajectory[0][1])
        );

        for (let i = 1; i < trajectory.length; i++) {

            ctx.lineTo(
                scaleX(trajectory[i][0]),
                scaleY(trajectory[i][1])
            );
        }

        ctx.strokeStyle = "#777";

        ctx.lineWidth =
            Math.max(1, scaleX(1.5));

        ctx.stroke();
    }


    // Drag line

    if (dragging) {

        ctx.beginPath();

        ctx.moveTo(
            scaleX(launchStartX),
            scaleY(launchStartY)
        );

        ctx.lineTo(
            scaleX(spacecraftX),
            scaleY(spacecraftY)
        );

        ctx.strokeStyle = "#f0c419";

        ctx.lineWidth = 2;

        ctx.stroke();
    }


    // Spacecraft

    ctx.beginPath();

    ctx.arc(
        scaleX(spacecraftX),
        scaleY(spacecraftY),
        Math.max(5, scaleX(10)),
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "#fff";

    ctx.fill();
}


// --------------------------------------------------
// SIMULATION LOOP
// --------------------------------------------------

function animate(currentTime) {

    const deltaTime =
        Math.min(currentTime - lastTime, 50);

    lastTime = currentTime;


    if (!crashed && !escaped && !dragging) {

        const dt =
            (deltaTime / 1000) * TIME_SCALE;


        // Planet position

        const planetX = 640;
        const planetY = 360;


        // Distance from spacecraft to planet

        const dx =
            planetX - spacecraftX;

        const dy =
            planetY - spacecraftY;

        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        // Gravity

        const gravity =
            500000 / (distance * distance);


        // Gravitational acceleration

        const accelerationX =
            (dx / distance) * gravity;

        const accelerationY =
            (dy / distance) * gravity;


        // Update velocity

        velocityX +=
            accelerationX * dt;

        velocityY +=
            accelerationY * dt;


        // Update position

        spacecraftX +=
            velocityX * dt * 60;

        spacecraftY +=
            velocityY * dt * 60;


        // Store trajectory

        trajectory.push([
            spacecraftX,
            spacecraftY
        ]);


        if (trajectory.length > 500) {

            trajectory.shift();
        }


        // Crash detection

        if (distance < 110) {

            crashed = true;

            statusText.textContent =
                "CRASHED";
        }


        // Escape detection

        if (distance > 600) {

            escaped = true;

            statusText.textContent =
                "ESCAPED";
        }
    }


    draw();

    requestAnimationFrame(animate);
}


// --------------------------------------------------
// POINTER POSITION
// --------------------------------------------------

function getPointerPosition(event) {

    const rect =
        canvas.getBoundingClientRect();

    return {

        x:
            (event.clientX - rect.left) *
            (BASE_WIDTH / displayWidth),

        y:
            (event.clientY - rect.top) *
            (BASE_HEIGHT / displayHeight)
    };
}


// --------------------------------------------------
// POINTER DOWN
// --------------------------------------------------

canvas.addEventListener(
    "pointerdown",
    function(event) {

        if (crashed || escaped) {
            return;
        }


        const pointer =
            getPointerPosition(event);


        const distance =
            Math.hypot(
                pointer.x - spacecraftX,
                pointer.y - spacecraftY
            );


        if (distance < 30) {

            dragging = true;

            launchStartX =
                pointer.x;

            launchStartY =
                pointer.y;


            velocityX = 0;
            velocityY = 0;


            canvas.setPointerCapture(
                event.pointerId
            );


            statusText.textContent =
                "AIMING";
        }
    }
);


// --------------------------------------------------
// POINTER MOVE
// --------------------------------------------------

canvas.addEventListener(
    "pointermove",
    function(event) {

        if (!dragging) {
            return;
        }


        const pointer =
            getPointerPosition(event);


        spacecraftX =
            pointer.x;

        spacecraftY =
            pointer.y;
    }
);


// --------------------------------------------------
// POINTER UP
// --------------------------------------------------

canvas.addEventListener(
    "pointerup",
    function(event) {

        if (!dragging) {
            return;
        }


        const pointer =
            getPointerPosition(event);


        dragging = false;


        // Launch opposite direction
        // from the drag

        velocityX =
            (launchStartX - pointer.x) * 0.08;

        velocityY =
            (launchStartY - pointer.y) * 0.08;


        statusText.textContent =
            "ORBITING";
    }
);


// --------------------------------------------------
// POINTER CANCEL
// --------------------------------------------------

canvas.addEventListener(
    "pointercancel",
    function() {

        if (dragging) {

            dragging = false;

            resetSimulation();
        }
    }
);


// --------------------------------------------------
// RESET BUTTON
// --------------------------------------------------

resetButton.addEventListener(
    "click",
    resetSimulation
);


// --------------------------------------------------
// WINDOW RESIZE
// --------------------------------------------------

window.addEventListener(
    "resize",
    resizeCanvas
);


// --------------------------------------------------
// START
// --------------------------------------------------

resetSimulation();

requestAnimationFrame(animate);

</script>

</body>
</html>
